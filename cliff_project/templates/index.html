<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louisiana Cliff</title>
    <link rel="stylesheet" href="styles.css">
</head>
<header>
    <h1>Louisiana Benefits Cliff</h1>
    <h3>Determine if a raise would affect your ability to maintain SNAP/Medicaid assistance.</h3>
</header>
<body>
    <form method="POST">
        <p>
            <label for="income">Current Monthly Income:</label>
            <input type="number" step="0.01" name="income" id="income" placeholder="1500" required>
        </p>
        <p>
            <label for="raise">Proposed Raise Amount per Month:</label>
            <input type="number" step="0.01" name="raise" id="raise" placeholder="Enter 0 if None" required>
        </p>
        <p>
            <input type="submit" value="Check My Risk">
        </p>
    </form>
</body>
<footer>
    <p><strong>Disclaimer:</strong> This tool is for informational purposes only and is not an official determination of benefits. Residents should always verify their status through <a href='https://www.dcfs.louisiana.gov/' target="_blank">CAFÉ Louisiana</a>.</p>
</footer>
</html>
